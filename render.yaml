services:
  # Backend Web Service (FastAPI + RAG Pipeline)
  - type: web
    name: eduguide-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -c "from huggingface_hub import hf_hub_download; from tokenizers import Tokenizer; hf_hub_download('sentence-transformers/all-MiniLM-L6-v2', 'onnx/model_O4.onnx'); Tokenizer.from_pretrained('sentence-transformers/all-MiniLM-L6-v2')"
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eduguide-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: EDUGUIDE_CORS_ORIGINS
        value: "https://eduguide-frontend.onrender.com"

  # Frontend Static Site (React + Vite)
  - type: web
    name: eduguide-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://eduguide-backend-7max.onrender.com

databases:
  - name: eduguide-db
    databaseName: eduguide_db
    user: eduguide_user
    plan: free
